services:
  - type: web
    name: smart-meds
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: ./instance/smart_meds.db
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: "false"
      - key: RUN_REMINDER_WORKER
        value: "true"
      - key: SMART_MEDS_DEMO_SEED
        value: "false"
      - key: VIVA_EXTERNAL_AI_ENABLED
        value: "false"
