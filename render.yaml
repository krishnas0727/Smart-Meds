services:
  - type: web
    name: smart-meds
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    healthCheckPath: /healthz
    disk:
      name: smart-meds-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/medcare.db
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: "false"
      - key: RUN_REMINDER_WORKER
        value: "true"
      - key: SMART_MEDS_DEMO_SEED
        value: "false"
      - key: VIVA_EXTERNAL_AI_ENABLED
        value: "false"
